    <!-- D3.js for Graph View -->

    <!-- PixiJS for WebGL Graph Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@25/dist/tween.umd.js"></script>
</head>

<body class="blog-page">
    <div id="app">
        <!-- Header -->
        <header class="site-header">
            <div class="container header-inner">
                <a href="./" class="logo">건축사사무소밤</a>
                <nav class="desktop-nav">
                    <a href="about.html">About</a>
                    <a href="projects.html">Projects</a>
                    <a href="blog.html" class="active">Blog</a>
                    <a href="law.html">Law</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <button class="mobile-toggle" aria-label="Toggle Menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </header>

        <!-- Main Content - Quartz Layout -->
        <main id="main-content" style="padding-top: 80px;">
            <div class="quartz-layout">
                <!-- Left Sidebar -->
                <aside class="quartz-sidebar-left">
                    <a href="blog.html" class="quartz-site-title">Blog</a>

                    <!-- Search Button -->
                    <button class="quartz-search-btn" id="open-search-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                        Search
                        <kbd>Ctrl+K</kbd>
                    </button>

                    <!-- Theme Toggle -->
                    <button class="quartz-theme-toggle" id="theme-toggle-btn">
                        <svg id="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" style="display:none;">
                            <circle cx="12" cy="12" r="5"></circle>
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42">
                            </path>
                        </svg>
                        <svg id="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <span id="theme-label">Dark mode</span>
                    </button>

                    <!-- Explorer -->
                    <div class="quartz-explorer">
                        <div class="quartz-explorer-title" id="explorer-toggle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                                height="16">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            Explorer
                        </div>
                        <ul class="quartz-explorer-list" id="explorer-list"></ul>
                    </div>
                </aside>

                <!-- Main Content -->
                <section class="quartz-content">
                    <div class="quartz-article">
                        <!-- Breadcrumb -->
                        <nav class="quartz-breadcrumb">
                            <a href="./">Home</a>
                            <span>›</span>
                            <span>Blog</span>
                        </nav>

                        <!-- Page Header -->
                        <header class="quartz-article-header">
                            <h1 class="quartz-article-title">Blog</h1>
                            <p style="color: var(--q-gray); margin: 0;">건축 설계, 건축법 해설, 프로젝트 이야기</p>
                        </header>

                        <!-- Tag Filter (if active) -->
                        <div id="tag-filter" style="margin-bottom: 1.5rem; display: none;">
                            <span style="color: var(--q-gray);">Filtered by:</span>
                            <span id="active-tag" class="quartz-tag"></span>
                            <a href="blog.html" style="margin-left: 0.5rem; color: var(--q-secondary);">× Clear
                                filter</a>
                        </div>

                        <!-- Post List -->
                        <ul class="quartz-post-list" id="blog-list">
                            <li style="padding: 2rem 0; color: var(--q-gray); text-align: center;">
                                포스트를 불러오는 중...
                            </li>
                        </ul>
                    </div>
                </section>

                <!-- Right Sidebar -->
                <aside class="quartz-sidebar-right">
                    <!-- Graph View -->
                    <section class="quartz-sidebar-section">
                        <div class="quartz-sidebar-title">Graph View</div>
                        <div class="quartz-graph">
                            <div class="quartz-graph-container" id="graph-container"></div>
                        </div>
                    </section>

                    <!-- Tags -->
                    <section class="quartz-sidebar-section">
                        <div class="quartz-sidebar-title">Tags</div>
                        <div class="quartz-tags" id="tag-cloud" style="gap: 0.5rem;"></div>
                    </section>

                    <!-- Recent Posts -->
                    <section class="quartz-sidebar-section">
                        <div class="quartz-sidebar-title">Recent</div>
                        <ul class="quartz-backlinks-list" id="recent-posts"></ul>
                    </section>
                </aside>
            </div>
        </main>

        <!-- Footer -->
        <footer class="quartz-footer">
            <p>Created with ❤️ by 건축사사무소밤 © 2026</p>
        </footer>
    </div>

    <!-- Quartz Features (Search & Graph) -->
    <script src="js/quartz-features.js"></script>

    <script type="module">
        import '/src/main.js';

        let allPosts = [];
        let filteredPosts = [];

        // Load posts
        async function loadPosts() {
            try {
                const response = await fetch('posts.json');
                allPosts = await response.json();

                // Load content for all posts
                allPosts = await Promise.all(allPosts.map(async (post) => {
                    try {
                        const mdRes = await fetch(`posts/${post.filename}`);
                        const text = await mdRes.text();
                        const cleanText = text.split('\n')
                            .filter(line => !line.includes('::'))
                            .map(line => line.replace(/^\s*-\s?/, ''))
                            .join(' ');

                        // Extract description
                        const descMatch = text.match(/description:\s*(.+)/);
                        const description = descMatch ? descMatch[1].trim() :
                            text.split('\n').find(l => l.length > 20 && !l.startsWith('#') && !l.includes('::') && !l.startsWith('---')) || '';

                        return { ...post, content: cleanText, description };
                    } catch (e) {
                        return { ...post, content: '', description: '' };
                    }
                }));

                filteredPosts = [...allPosts];

                // Check for tag filter
                const urlParams = new URLSearchParams(window.location.search);
                const tagFilter = urlParams.get('tag');
                if (tagFilter) {
                    filteredPosts = allPosts.filter(post => post.tags?.includes(tagFilter));
                    document.getElementById('tag-filter').style.display = 'block';
                    document.getElementById('active-tag').textContent = tagFilter;
                }

                renderPosts(filteredPosts);
                renderExplorer();
                renderTags();
                renderRecentPosts();

                // Initialize Quartz features (search & graph)
                if (typeof initQuartzFeatures === 'function') {
                    initQuartzFeatures(allPosts);
                }
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('blog-list').innerHTML = '<li style="padding: 2rem 0; color: red;">포스트를 불러오는데 실패했습니다.</li>';
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('blog-list');
            if (!posts.length) {
                container.innerHTML = '<li style="padding: 2rem 0; text-align: center; color: var(--q-gray);">포스트가 없습니다.</li>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <li class="quartz-post-item">
                    <a href="blog-post.html?id=${post.id}">
                        <div class="quartz-post-item-meta">${post.date}</div>
                        <h3 class="quartz-post-item-title">${post.title}</h3>
                        <p class="quartz-post-item-excerpt">${post.description || ''}</p>
                    </a>
                </li>
            `).join('');
        }

        function renderExplorer() {
            const explorerList = document.getElementById('explorer-list');
            explorerList.innerHTML = allPosts.map(post => `
                <li class="quartz-explorer-item">
                    <a href="blog-post.html?id=${post.id}">${post.title}</a>
                </li>
            `).join('');
        }

        function renderTags() {
            const tagCloud = document.getElementById('tag-cloud');
            const tagCounts = {};
            allPosts.forEach(post => {
                if (post.tags) {
                    post.tags.forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                }
            });

            const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
            tagCloud.innerHTML = sortedTags.length
                ? sortedTags.map(([tag, count]) => `<a href="blog.html?tag=${tag}" class="quartz-tag">${tag}</a>`).join('')
                : '<span style="color: var(--q-gray); font-size: 0.9rem;">No tags</span>';
        }

        function renderRecentPosts() {
            const recentList = document.getElementById('recent-posts');
            recentList.innerHTML = allPosts.slice(0, 5).map(post =>
                `<li><a href="blog-post.html?id=${post.id}">${post.title}</a></li>`
            ).join('');
        }

        // Theme toggle - Quartz Style
        const switchTheme = () => {
            const currentTheme = document.documentElement.getAttribute('saved-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('saved-theme', newTheme);
            document.body.classList.toggle('dark-mode', newTheme === 'dark');
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        };

        const updateThemeIcon = (theme) => {
            document.getElementById('theme-icon-light').style.display = theme === 'dark' ? 'none' : 'inline';
            document.getElementById('theme-icon-dark').style.display = theme === 'dark' ? 'inline' : 'none';
            document.getElementById('theme-label').textContent = theme === 'dark' ? 'Dark mode' : 'Light mode';
        };

        document.getElementById('theme-toggle-btn').addEventListener('click', switchTheme);

        // Explorer toggle
        document.getElementById('explorer-toggle').addEventListener('click', () => {
            const title = document.getElementById('explorer-toggle');
            const list = document.getElementById('explorer-list');
            title.classList.toggle('collapsed');
            list.style.display = title.classList.contains('collapsed') ? 'none' : 'block';
        });

        // Search button
        document.getElementById('open-search-btn').addEventListener('click', () => {
            if (window.quartzSearch) {
                window.quartzSearch.open();
            }
        });

        // Initialize theme on page load (before DOMContentLoaded to prevent flash)
        const userPref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const savedTheme = localStorage.getItem('theme') ?? userPref;
        document.documentElement.setAttribute('saved-theme', savedTheme);
        document.body.classList.toggle('dark-mode', savedTheme === 'dark');

        // Initialize on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            updateThemeIcon(document.documentElement.getAttribute('saved-theme'));
            loadPosts();
        });
    </script>
</body>

</html>
